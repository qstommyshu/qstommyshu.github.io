<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages

      // This script takes the current url and converts the path and query
      // string into just a query string, then redirects the browser
      // to the new url with only a query string and hash fragment

      // For GitHub user pages (like username.github.io), we don't need any special handling

      var l = window.location;

      // Save the full path including query string
      var path = l.pathname + l.search;

      // Store the full path directly in sessionStorage
      sessionStorage.setItem("spa-path", path);

      // Redirect to the root with no query string
      window.location.href =
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "");
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
