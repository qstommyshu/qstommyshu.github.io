    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function () {
        // Check if coming from a redirect
        var redirectPath = sessionStorage.getItem("spa-path");
        if (redirectPath) {
          // Remove the stored path from sessionStorage
          sessionStorage.removeItem("spa-path");

          // Use history API to redirect to the original URL without causing a page refresh
          var cleanPath = redirectPath;
          window.history.replaceState(null, null, cleanPath);
        }
      })();
    </script>
